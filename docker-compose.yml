# X1 Apex Factory — self-hosted services, with hard ceilings.
#
# This is the LOCAL / private-cloud half of the system. The app itself runs on Base44 (cloud
# primary); these two containers are what it talks to for browser work and avatar rendering.
# Run them here, or on any Docker host, and point the app at them (see LOCAL.md).
#
#   cp .env.example .env   &&   docker compose up -d --build
#
# Every ceiling below is enforced by the container runtime, not by app code: a runaway render or a
# leaked browser session is killed by the kernel, not by a promise in TypeScript.

services:
  avatar-host:
    build: ./avatar-host
    container_name: x1-avatar-host
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      HOST_TOKEN: ${AVATAR_HOST_TOKEN:?set AVATAR_HOST_TOKEN in .env}
      PORT: 8080
      DATA_DIR: /data
      WAV2LIP_DIR: /opt/wav2lip
      VOICE: /opt/voices/voice.onnx
      MAX_RENDER_SECONDS: ${AVATAR_MAX_RENDER_SECONDS:-7200}
      MAX_CHARS: ${AVATAR_MAX_CHARS:-20000}
    volumes:
      - avatar-data:/data
    # Ceilings: her renderer never takes the whole machine, and never grows without bound.
    cpus: "2.0"
    mem_limit: 6g
    memswap_limit: 6g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  browser-host:
    build: ./browser-host
    container_name: x1-browser-host
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      HOST_TOKEN: ${BROWSER_HOST_TOKEN:?set BROWSER_HOST_TOKEN in .env}
      PORT: 8080
      DATA_DIR: /data
      MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-50}
      HARD_CAP_SECONDS: ${BROWSER_HARD_CAP_SECONDS:-21600}
      DEFAULT_TIMEOUT_SECONDS: ${BROWSER_DEFAULT_TIMEOUT_SECONDS:-21600}
    volumes:
      - browser-data:/data
    # Ceilings: Chromium is the expensive part, so the browser gets the larger slice and a real
    # /dev/shm (without it Chromium falls over on any page with a canvas).
    cpus: "4.0"
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 1g
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  avatar-data:
  browser-data:

networks:
  default:
    name: x1-hosts